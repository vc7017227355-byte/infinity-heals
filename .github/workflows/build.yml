name: Build TWA AAB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build TWA APK
        uses: FedericoBruzzone/twa-action@v1
        with:
          domain: graceful-tulumba-ff85c3.netlify.app
          package-id: com.infinityheals.app

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: infinity-heals-aab
          path: '**/*.aab'
