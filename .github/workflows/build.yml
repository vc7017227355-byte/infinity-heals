name: Build TWA AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create TWA Android Project
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa-app
          cd twa-app
          sed -i 's|https://svgomg.firebaseapp.com|https://graceful-tulumba-ff85c3.netlify.app|g' app/build.gradle
          sed -i 's|net.developeralgo.svgomg|com.infinityheals.app|g' app/build.gradle

      - name: Build AAB
        run: |
          cd twa-app
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: infinity-heals-aab
          path: twa-app/app/build/outputs/bundle/release/app-release.aab
