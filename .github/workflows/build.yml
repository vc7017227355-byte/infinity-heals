name: Build TWA AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Init TWA
        run: bubblewrap init --manifest https://graceful-tulumba-ff85c3.netlify.app/manifest.json --directory twa-app
      - name: Build AAB
        run: cd twa-app && bubblewrap build
      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: infinity-heals-aab
          path: twa-app/app-release-bundle.aab
