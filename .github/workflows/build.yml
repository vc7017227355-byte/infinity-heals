name: Build TWA AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create TWA Project
        run: |
          mkdir twa-app
          cd twa-app
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          EOF
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA
        run: |
          cd twa-app
          bubblewrap init \
            --manifest https://graceful-tulumba-ff85c3.netlify.app/manifest.json \
            --skipPwaValidation \
            --jdkPath $JAVA_HOME \
            --androidSdkPath $ANDROID_SDK_ROOT

      - name: Build AAB
        run: |
          cd twa-app
          bubblewrap build --skipPwaValidation

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: infinity-heals-aab
          path: twa-app/app-release-bundle.aab
