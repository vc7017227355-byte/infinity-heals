# nginx-signalboard.conf
# Routes wss://YOUR_DOMAIN/relay -> localhost:8090 (relay-server-105-FINAL.js)
# and    wss://YOUR_DOMAIN/angel -> localhost:8766 (angel-server-101-FINAL.js)
#
# Install:
#   sudo cp nginx-signalboard.conf /etc/nginx/sites-available/signalboard
#   sudo ln -s /etc/nginx/sites-available/signalboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN below with your actual domain or tunnel hostname.
# TLS (wss://) is expected to terminate here if you're on a real domain
# with certbot, OR upstream at Cloudflare if you're using a Cloudflare
# Tunnel in front of this (in that case this nginx block can just listen
# on plain HTTP, since Cloudflare handles the TLS/wss part).

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /relay {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /angel {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
